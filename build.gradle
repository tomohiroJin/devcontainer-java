plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    // Mockito's inline mock maker must be attached as a Java agent; self-attachment
    // is disabled on modern JDKs.
    mockitoAgent
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    mockitoAgent('org.mockito:mockito-core:5.24.0') { transitive = false }
}

// Enable locking before the test agent resolves its configuration.
dependencyLocking {
    lockAllConfigurations()
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}
