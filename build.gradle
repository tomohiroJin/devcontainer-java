plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    // Mockito's inline mock maker is attached explicitly as a Java agent so the tests do not
    // depend on dynamic self-attachment, which current JDKs warn about and plan to disable.
    mockitoAgent
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    mockitoAgent('org.mockito:mockito-core:5.24.0') { transitive = false }
}

// Enable locking before the test agent resolves its configuration.
dependencyLocking {
    lockAllConfigurations()
}

test {
    useJUnitPlatform()
    // Resolve the agent lazily so unrelated tasks (wrapper, help) do not need the dependency cache.
    // Capture the file collection outside the closure to stay configuration-cache compatible.
    def mockitoAgentFiles = configurations.mockitoAgent
    inputs.files(mockitoAgentFiles).withPropertyName('mockitoAgent')
    jvmArgumentProviders.add({ ["-javaagent:${mockitoAgentFiles.singleFile}"] } as CommandLineArgumentProvider)
}
