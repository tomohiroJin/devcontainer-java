plugins {
    id 'java'
    id 'org.springframework.boot'        version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless'           version '8.8.0'
    id 'checkstyle'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Spring Boot ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- DB migration (H2 は flyway-core のみで動作) ---
    implementation 'org.flywaydb:flyway-core'

    // --- Lombok (バージョンは Spring Boot BOM 管理: 1.18.46 / JDK 25 対応) ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- ローカル DB (H2, SQL 練習用) ---
    runtimeOnly 'com.h2database:h2'

    // --- テスト ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

// フォーマットは Spotless が一次担保 (google-java-format)
spotless {
    java {
        googleJavaFormat('1.35.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Checkstyle は学習用途では情報提供に留め、ビルドは止めない
// (整形は Spotless が担保するため、ここでは設計上の指摘のみを見る)
checkstyle {
    toolVersion = '13.8.0'
    ignoreFailures = true
    maxWarnings = Integer.MAX_VALUE
}

jacoco {
    toolVersion = '0.8.15'
}
